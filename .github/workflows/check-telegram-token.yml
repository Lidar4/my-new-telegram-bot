name: Verify Telegram Bot Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token with Telegram without printing it
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          if (!token) {
            console.error('Missing GitHub Actions secret: TELEGRAM_BOT_TOKEN');
            process.exit(1);
          }

          const response = await fetch(`https://api.telegram.org/bot${token}/getMe`);
          const data = await response.json().catch(() => ({}));

          if (!response.ok || data.ok !== true) {
            console.error('Telegram rejected the token or the API request failed. Check the secret in GitHub Settings; the token is never printed here.');
            process.exit(1);
          }

          console.log(`Token verified successfully for @${data.result.username}.`);
          console.log('This checks the token only; it does not keep the bot running.');
          NODE
